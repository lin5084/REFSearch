name: Build REFSearch Windows EXE
on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Go mod tidy
        run: go mod tidy

      - name: Cross compile REFSearch.exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -ldflags "-s -w" -o REFSearch.exe main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: REFSearch-Windows-amd64
          path: REFSearch.exe
